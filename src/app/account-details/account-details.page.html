<ion-header translucent>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Account
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>

  <form [formGroup]="userInfoFormGroup">
    <ion-card>
      <ion-card-content>

        <div *ngIf="!(storedUserProfile | async)?.profileImage">
          <ion-grid fixed>
            <ion-row>
              <ion-col size="6">
                <div style="width: 100%; height: 100%;">
                  <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
                </div>
              </ion-col>
              <ion-col size="6">
                <ion-skeleton-text animated></ion-skeleton-text>
                <ion-skeleton-text animated></ion-skeleton-text>
              </ion-col>
            </ion-row>
          </ion-grid>
          <ion-skeleton-text animated></ion-skeleton-text>
        </div>


        <div *ngIf="(storedUserProfile | async) as userProfile">
          <ion-grid fixed>
            <ion-row>
              <ion-col size="12">
                <div style="width: 100%; height: 100%;">
                  <ion-avatar class="profile-picture">
                    <ion-img [src]="userProfile.profileImage">
                    </ion-img>
                    <ion-icon (click)="selectImageSource()" color="success" class="camera-button" name="camera">
                    </ion-icon>
                  </ion-avatar>
                </div>
              </ion-col>
              <!-- <ion-col size="6" style="text-align:center; padding: auto; margin: auto;">
                <ion-label *ngIf="!editingName">
                  <h2 text-uppercase>{{ userProfile.name }}</h2>
                  <ion-icon name="create" style="font-size: 24px;" (click)="editingName = !editingName"></ion-icon>
                </ion-label>
              </ion-col> -->
            </ion-row>
          </ion-grid>

          <div *ngIf="!editingName">
            <ion-item>
              <ion-icon slot="start" name="person"></ion-icon>
              <ion-label text-uppercase>{{ userProfile.name }}</ion-label>
              <ion-icon slot="end" name="create" (click)="editingName = !editingName"></ion-icon>
            </ion-item>
          </div>
        </div>

        <div *ngIf="editingName">
          <ion-item>
            <ion-icon slot="start" name="person"></ion-icon>
            <ion-icon *ngIf="userInfoFormGroup.valid && userInfoFormGroup.dirty" slot="end" name="checkmark"
              (click)="updateUserDisplayName()"></ion-icon>
            <ion-icon slot="end" name="close" (click)="editingName = !editingName"></ion-icon>
            <ion-input placeholder="Enter Full Name" formControlName="name" type="text"></ion-input>
          </ion-item>

          <div *ngFor="let validation of validationMessages.name" class="validation-errors">
            <ion-item class="error-message" *ngIf="isError('name', validation.type)">
              <ion-icon name="alert"></ion-icon>
              <ion-label>{{ validation.message }}</ion-label>
            </ion-item>
          </div>
        </div>

        <ion-item *ngIf="(storedUserProfile | async)?.email as email">
          <ion-icon slot="start" name="mail"></ion-icon>
          <ion-label>{{ email }}</ion-label>
        </ion-item>

        <ion-button (click)="confirmLogOut()" class="expand-button" color="danger"> Log Out
        </ion-button>

      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
